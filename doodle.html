<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurvritaren</title>
<style>
  :root{
    --skal:#c0392b; --skarm:#c8ccbe; --linje:#2b2f28; --bleck:#9aa08f;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1512;cursor:none;
    font-family:var(--mono);color:#2b2f28;-webkit-font-smoothing:antialiased}
  #skal{position:absolute;inset:18px;background:var(--skal);border-radius:26px;
    box-shadow:inset 0 2px 0 #ffffff30, inset 0 -6px 18px #00000040, 0 18px 50px #0008;
    padding:26px 26px 92px}
  #skarm{position:relative;width:100%;height:100%;background:var(--skarm);
    border-radius:8px;overflow:hidden;box-shadow:inset 0 3px 14px #0006}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  #rad{position:absolute;left:30px;right:30px;bottom:26px;height:52px;
    display:flex;align-items:center;justify-content:space-between;gap:20px}
  .ratt{width:52px;height:52px;border-radius:50%;background:#f0f0ea;
    box-shadow:inset 0 -3px 8px #0003, 0 3px 8px #0005;position:relative}
  .ratt i{position:absolute;left:50%;top:5px;width:3px;height:19px;margin-left:-1.5px;
    background:#2b2f28;border-radius:2px;transform-origin:50% 21px}
  #status{flex:1;text-align:center;color:#ffffffdd;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase}
  #stat2{flex:1;text-align:center;color:#ffffff88;font-size:10px}

  /* tangentbordet, med de två halvorna tonade var för sig */
  #kb{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;
    --u:15px;width:calc(22.5*var(--u));height:calc(6.5*var(--u));opacity:.75}
  .k{position:absolute;border-radius:2px}
  .k.v{background:#2b6cb038} .k.h{background:#b0341038}
  .k.hit{background:#2b2f28dd}

  #dom{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;
    width:440px;max-height:84%;overflow:auto;padding:26px 28px;background:#f4f4ee;
    border-radius:6px;box-shadow:0 24px 60px #0009;opacity:0;pointer-events:none;
    transition:opacity .4s}
  #dom.on{opacity:1}
  #dom .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7b8072}
  #dom h1{margin:5px 0 2px;font-size:25px;line-height:1.15}
  #dom .skal{font-size:11px;color:#7b8072;margin-bottom:16px}
  #dom canvas{position:static;width:100%;height:120px;background:#e6e7df;border-radius:4px;
    margin-bottom:14px}
  #dom .row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
    border-top:1px solid #d7d8ce;font-size:11.5px}
  #dom .lbl{color:#7b8072}
  #dom .foot{margin-top:16px;font-size:9.5px;color:#929889;line-height:1.65}
</style>
</head>
<body>
<div id="skal">
  <div id="skarm">
    <canvas id="c"></canvas>
    <div id="kb"></div>
  </div>
  <div id="rad">
    <div class="ratt" id="r-v"><i></i></div>
    <div id="status">vänster hand drar i sidled</div>
    <div id="stat2">höger hand i höjdled</div>
    <div class="ratt" id="r-h"><i></i></div>
  </div>
</div>

<div id="dom">
  <div class="eyebrow">du ritade</div>
  <h1 id="d-amne">—</h1>
  <div class="skal" id="d-skal"></div>
  <canvas id="d-kurva" width="760" height="240"></canvas>
  <div id="d-rader"></div>
  <div class="foot">Kurvan jämförs med 6 302 tidsserier ur Världsbankens öppna data.
    Ämnet väljs ur linjens egen karaktär. Sambandet är inget samband.</div>
</div>

<script>
/* ==========================================================================
   KURVRITAREN
   Etch-a-Sketch på ett tangentbord. Vänstra halvan är den vågräta ratten,
   högra den lodräta: var din tyngdpunkt ligger inom sin halva ger riktning
   och fart. Pennan lyfts aldrig, så det blir en enda sammanhängande linje —
   och en sammanhängande linje från vänster till höger är en graf.

   Sedan läses linjens karaktär för att välja ämne, och formen för att hitta
   vilken av Världsbankens tidsserier den "är".
   ========================================================================== */

const KB_W = 22.5, KB_H = 6.5, DELARE = 7.0;     // tangentbordets mittlinje
const KEYS = [
  ['Escape',0,0,1],['F1',2,0,1],['F2',3,0,1],['F3',4,0,1],['F4',5,0,1],
  ['F5',6.5,0,1],['F6',7.5,0,1],['F7',8.5,0,1],['F8',9.5,0,1],
  ['F9',11,0,1],['F10',12,0,1],['F11',13,0,1],['F12',14,0,1],
  ['PrintScreen',15.25,0,1],['ScrollLock',16.25,0,1],['Pause',17.25,0,1],
  ['Backquote',0,1.5,1],['Digit1',1,1.5,1],['Digit2',2,1.5,1],['Digit3',3,1.5,1],
  ['Digit4',4,1.5,1],['Digit5',5,1.5,1],['Digit6',6,1.5,1],['Digit7',7,1.5,1],
  ['Digit8',8,1.5,1],['Digit9',9,1.5,1],['Digit0',10,1.5,1],['Minus',11,1.5,1],
  ['Equal',12,1.5,1],['Backspace',13,1.5,2],
  ['Insert',15.25,1.5,1],['Home',16.25,1.5,1],['PageUp',17.25,1.5,1],
  ['NumLock',18.5,1.5,1],['NumpadDivide',19.5,1.5,1],['NumpadMultiply',20.5,1.5,1],['NumpadSubtract',21.5,1.5,1],
  ['Tab',0,2.5,1.5],['KeyQ',1.5,2.5,1],['KeyW',2.5,2.5,1],['KeyE',3.5,2.5,1],
  ['KeyR',4.5,2.5,1],['KeyT',5.5,2.5,1],['KeyY',6.5,2.5,1],['KeyU',7.5,2.5,1],
  ['KeyI',8.5,2.5,1],['KeyO',9.5,2.5,1],['KeyP',10.5,2.5,1],
  ['BracketLeft',11.5,2.5,1],['BracketRight',12.5,2.5,1],['Backslash',13.5,2.5,1.5],
  ['Delete',15.25,2.5,1],['End',16.25,2.5,1],['PageDown',17.25,2.5,1],
  ['Numpad7',18.5,2.5,1],['Numpad8',19.5,2.5,1],['Numpad9',20.5,2.5,1],['NumpadAdd',21.5,2.5,1],
  ['CapsLock',0,3.5,1.75],['KeyA',1.75,3.5,1],['KeyS',2.75,3.5,1],['KeyD',3.75,3.5,1],
  ['KeyF',4.75,3.5,1],['KeyG',5.75,3.5,1],['KeyH',6.75,3.5,1],['KeyJ',7.75,3.5,1],
  ['KeyK',8.75,3.5,1],['KeyL',9.75,3.5,1],['Semicolon',10.75,3.5,1],['Quote',11.75,3.5,1],
  ['Enter',12.75,3.5,2.25],
  ['Numpad4',18.5,3.5,1],['Numpad5',19.5,3.5,1],['Numpad6',20.5,3.5,1],
  ['ShiftLeft',0,4.5,2.25],['KeyZ',2.25,4.5,1],['KeyX',3.25,4.5,1],['KeyC',4.25,4.5,1],
  ['KeyV',5.25,4.5,1],['KeyB',6.25,4.5,1],['KeyN',7.25,4.5,1],['KeyM',8.25,4.5,1],
  ['Comma',9.25,4.5,1],['Period',10.25,4.5,1],['Slash',11.25,4.5,1],['ShiftRight',12.25,4.5,2.75],
  ['ArrowUp',16.25,4.5,1],
  ['Numpad1',18.5,4.5,1],['Numpad2',19.5,4.5,1],['Numpad3',20.5,4.5,1],['NumpadEnter',21.5,4.5,1],
  ['ControlLeft',0,5.5,1.25],['MetaLeft',1.25,5.5,1.25],['AltLeft',2.5,5.5,1.25],
  ['Space',3.75,5.5,6.25],['AltRight',10,5.5,1.25],['MetaRight',11.25,5.5,1.25],
  ['ContextMenu',12.5,5.5,1.25],['ControlRight',13.75,5.5,1.25],
  ['ArrowLeft',15.25,5.5,1],['ArrowDown',16.25,5.5,1],['ArrowRight',17.25,5.5,1],
  ['Numpad0',18.5,5.5,2],['NumpadDecimal',20.5,5.5,1],
];
const POS = new Map(KEYS.map(([c,x,y,w]) => [c, {x: x + w/2, y: y + 0.5}]));
const $ = id => document.getElementById(id);

/* --- duk och tangentbords-HUD -------------------------------------------- */
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){
  const r = Math.min(devicePixelRatio || 1, 2), b = cv.getBoundingClientRect();
  const forstaGangen = !W;
  W = cv.width = Math.round(b.width * r); H = cv.height = Math.round(b.height * r);
  ctx.lineCap = ctx.lineJoin = 'round';
  if(forstaGangen){ pennaX = W * 0.08; pennaY = H * 0.5; }
  rita();
}
addEventListener('resize', resize);

const kb = $('kb'), keyEls = new Map();
for(const [code,x,y,w] of KEYS){
  const el = document.createElement('div');
  el.className = 'k ' + (x + w/2 < DELARE ? 'v' : 'h');
  el.style.left = `calc(${x} * var(--u) + 1px)`;
  el.style.top = `calc(${y} * var(--u) + 1px)`;
  el.style.width = `calc(${w} * var(--u) - 2px)`;
  el.style.height = 'calc(1 * var(--u) - 2px)';
  kb.appendChild(el); keyEls.set(code, el);
}

/* --- inmatning ------------------------------------------------------------ */
const down = new Set();
let intensity = 0, hits = 0;
let vx = 0, vy = 0;                 // rattarnas utslag, -1..1
let pennaX = 0, pennaY = 0;
let bana = [];                      // en enda sammanhängande linje
let skakSedan = 0, dirty = false, stillSedan = 0, domVisas = false;

const TAU_I = 0.22, FART = 0.55;    // andel av dukens bredd per sekund vid fullt utslag
const SETTLE_MS = 1400, SKAK_NIVA = 42, SKAK_MS = 350;

addEventListener('keydown', e => {
  if(e.metaKey) return;
  e.preventDefault();
  if(!POS.has(e.code)) return;
  down.add(e.code);
  if(e.repeat) return;
  hits++;
  const el = keyEls.get(e.code); if(el) el.classList.add('hit');
}, true);
addEventListener('keyup', e => {
  if(!e.metaKey) e.preventDefault();
  down.delete(e.code);
  const el = keyEls.get(e.code); if(el) el.classList.remove('hit');
}, true);
addEventListener('blur', () => { down.clear(); keyEls.forEach(el => el.classList.remove('hit')); });

/* --- ritloopen ------------------------------------------------------------ */
resize();                      // först här finns bana och pennan att röra vid
let sist = performance.now();
requestAnimationFrame(function frame(nu){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (nu - sist) / 1000); sist = nu;

  intensity = intensity * Math.exp(-dt / TAU_I) + hits + down.size * 5 * dt;
  hits = 0;

  /* Rattarna: tyngdpunkten inom sin egen halva, mätt från halvans mitt.
     Det ger både riktning och fart, precis som att vrida mer på en ratt. */
  let vn = 0, vs = 0, hn = 0, hs = 0;
  for(const k of down){
    const p = POS.get(k);
    if(p.x < DELARE){ vs += p.x; vn++; } else { hs += p.y; hn++; }
  }
  const mal_vx = vn ? ((vs / vn) / DELARE - 0.5) * 2 : 0;
  const mal_vy = hn ? -(((hs / hn) - 0.5) / (KB_H - 1) - 0.5) * 2 : 0;
  const k = Math.exp(-dt / 0.09);
  vx = vx * k + mal_vx * (1 - k);
  vy = vy * k + mal_vy * (1 - k);

  const kraft = 0.3 + 0.7 * Math.min(1, intensity / 9);
  if(Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02){
    pennaX = Math.max(0, Math.min(W, pennaX + vx * kraft * FART * W * dt));
    pennaY = Math.max(0, Math.min(H, pennaY + vy * kraft * FART * W * dt));
    const sista = bana[bana.length - 1];
    if(!sista || Math.hypot(pennaX - sista[0], pennaY - sista[1]) > W * 0.002){
      bana.push([pennaX, pennaY]);
      dirty = true; stillSedan = 0;
      if(domVisas){ $('dom').classList.remove('on'); domVisas = false; }
      rita();
    }
  }

  /* Skaka för att sudda: en våldsam rullning över hela tangentbordet. */
  if(intensity > SKAK_NIVA){
    if(!skakSedan) skakSedan = nu;
    else if(nu - skakSedan > SKAK_MS){ sudda(); skakSedan = nu + 1e6; }
  } else skakSedan = 0;

  if(!stillSedan && intensity < 1.2) stillSedan = nu;
  if(intensity >= 1.2) stillSedan = 0;
  if(dirty && stillSedan && nu - stillSedan > SETTLE_MS && bana.length > 12){
    dirty = false; analysera();
  }

  $('r-v').firstElementChild.style.transform = `rotate(${vx * 140}deg)`;
  $('r-h').firstElementChild.style.transform = `rotate(${-vy * 140}deg)`;
  $('stat2').textContent = `${bana.length} punkter`;
});

function rita(){
  ctx.clearRect(0, 0, W, H);
  if(bana.length < 2) return;
  ctx.strokeStyle = '#2b2f28';
  ctx.lineWidth = Math.max(1.5, W * 0.0022);
  ctx.beginPath();
  ctx.moveTo(bana[0][0], bana[0][1]);
  for(let i = 1; i < bana.length; i++) ctx.lineTo(bana[i][0], bana[i][1]);
  ctx.stroke();
}

function sudda(){
  bana = []; pennaX = W * 0.08; pennaY = H * 0.5;
  dirty = false; stillSedan = 0;
  $('dom').classList.remove('on'); domVisas = false;
  $('status').textContent = 'suddat';
  rita();
}

/* ==========================================================================
   ANALYSEN
   Två steg, båda ur bilden. Linjens karaktär — lutning, krökning, tagghet,
   vändningar, spann — väljer ÄMNE. Linjens form väljer sedan SERIE inom det
   ämnet. Varken steg vet något om vad du tänkte på.
   ========================================================================== */
const N = 40;
let KORPUS = null;
fetch('kurvor.json').then(r => r.json()).then(d => {
  d.avkodad = d.serier.map(rad => {
    const b = atob(rad[5]), a = new Float64Array(N);
    for(let i = 0; i < N; i++) a[i] = b.charCodeAt(i) / 255;
    return a;
  });
  KORPUS = d;
  $('status').textContent = 'vänster hand drar i sidled';
}).catch(() => { $('status').textContent = 'kurvor.json saknas'; });

/* Banan kan vika tillbaka i x, så varje x-fack får medelvärdet av punkterna
   i facket. Tomma fack interpoleras. Resultatet är en funktion av x. */
function banaTillKurva(){
  if(bana.length < 12) return null;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for(const [x, y] of bana){
    if(x < x0) x0 = x; if(x > x1) x1 = x;
    if(y < y0) y0 = y; if(y > y1) y1 = y;
  }
  if(x1 - x0 < W * 0.08) return null;             // för smal för att vara en graf
  const sum = new Float64Array(N), antal = new Float64Array(N);
  for(const [x, y] of bana){
    const b = Math.min(N - 1, Math.floor((x - x0) / (x1 - x0) * N));
    sum[b] += (H - y); antal[b]++;                // y uppåt
  }
  const v = new Array(N).fill(null);
  for(let i = 0; i < N; i++) if(antal[i]) v[i] = sum[i] / antal[i];
  for(let i = 0; i < N; i++){
    if(v[i] !== null) continue;
    let a = i - 1; while(a >= 0 && v[a] === null) a--;
    let b = i + 1; while(b < N && v[b] === null) b++;
    if(a < 0 && b >= N) return null;
    v[i] = a < 0 ? v[b] : b >= N ? v[a] : v[a] + (v[b] - v[a]) * (i - a) / (b - a);
  }
  const lo = Math.min(...v), hi = Math.max(...v);
  const kurva = new Float64Array(N);
  for(let i = 0; i < N; i++) kurva[i] = hi - lo < 1e-9 ? 0.5 : (v[i] - lo) / (hi - lo);
  return {kurva, spann: (y1 - y0) / H};
}

function drag(kurva, spann){
  const d1 = [], d2 = [];
  for(let i = 1; i < N; i++) d1.push(kurva[i] - kurva[i - 1]);
  for(let i = 1; i < d1.length; i++) d2.push(d1[i] - d1[i - 1]);
  const medel = a => a.reduce((x, y) => x + y, 0) / a.length;
  let vand = 0;
  for(let i = 1; i < d1.length; i++)
    if(Math.sign(d1[i]) && Math.sign(d1[i]) !== Math.sign(d1[i - 1])) vand++;

  /* Krökning som avvikelse från kordan mellan ändpunkterna. Medelvärdet av
     andraderivatan duger inte: summan teleskoperar till skillnaden mellan
     första och sista lutningen, så en sicksack fick vilket värde som helst
     beroende på var den råkade sluta. */
  let avvikelse = 0;
  for(let i = 0; i < N; i++){
    const korda = kurva[0] + (kurva[N - 1] - kurva[0]) * i / (N - 1);
    avvikelse += kurva[i] - korda;
  }
  avvikelse /= N;

  /* Taggheten mäts på den normaliserade kurvan, så en nästan plan linje får
     sitt lilla darr uppförstorat till fullskala. Dämpa med hur mycket av
     dukens höjd linjen faktiskt använder. */
  const damp = Math.min(1, spann / 0.25);

  return {
    lutning: Math.max(-1, Math.min(1, (kurva[N - 1] - kurva[0]) * 1.2)),
    krokning: Math.max(-1, Math.min(1, -avvikelse * 4)),
    tagghet: Math.min(1, medel(d2.map(Math.abs)) * N * 1.6) * damp,
    vandningar: Math.min(1, vand / (N * 0.45)) * damp,
    spann: Math.min(1, spann * 1.15),
  };
}

/* Varje ämne har en tänkt profil i samma femdimensionella rum. Siffrorna är
   mitt tyckande om hur "mat" respektive "ekonomi" rör sig, ingenting annat. */
const PROFILER = {
  mat:        [ 0.00,  0.00, 0.15, 0.15, 0.35],
  natur:      [-0.50, -0.10, 0.12, 0.10, 0.40],
  halsa:      [ 0.70,  0.00, 0.10, 0.08, 0.70],
  energi:     [ 0.30,  0.10, 0.35, 0.30, 0.55],
  stader:     [ 0.80,  0.10, 0.08, 0.05, 0.80],
  teknik:     [ 0.90,  0.60, 0.15, 0.08, 0.85],
  utbildning: [ 0.40,  0.00, 0.25, 0.25, 0.45],
  ekonomi:    [ 0.00,  0.00, 0.70, 0.60, 0.75],
};
const VIKTER = [1.3, 1.0, 1.6, 1.2, 0.7];

function valjAmne(d){
  const v = [d.lutning, d.krokning, d.tagghet, d.vandningar, d.spann];
  let bast = null, bd = Infinity;
  for(const [nyckel, prof] of Object.entries(PROFILER)){
    let s = 0;
    for(let i = 0; i < 5; i++) s += VIKTER[i] * (v[i] - prof[i]) ** 2;
    if(s < bd){ bd = s; bast = nyckel; }
  }
  return bast;
}

function beskriv(d){
  const ord = [];
  ord.push(d.lutning > 0.45 ? 'starkt stigande' : d.lutning > 0.15 ? 'stigande'
         : d.lutning < -0.45 ? 'brant fallande' : d.lutning < -0.15 ? 'fallande'
         : 'ungefär plan');
  /* Krökning säger ingenting om en linje som ändå hoppar upp och ner. */
  if(d.tagghet < 0.5){
    if(d.krokning > 0.3) ord.push('accelererande');
    else if(d.krokning < -0.3) ord.push('avtagande');
  }
  ord.push(d.tagghet > 0.45 ? 'taggig' : d.tagghet < 0.15 ? 'jämn' : 'lätt ojämn');
  if(d.vandningar > 0.35) ord.push(`${Math.round(d.vandningar * N * 0.45)} vändningar`);
  return ord.join(', ');
}

let analyserar = false;
function analysera(){
  if(analyserar || !KORPUS) return;
  analyserar = true;
  try{
    const res = banaTillKurva();
    if(!res) return;
    const d = drag(res.kurva, res.spann);
    const amne = valjAmne(d);
    const amneIdx = KORPUS.amnen.findIndex(a => a[0] === amne);

    let bast = null, tvaa = null;
    for(let i = 0; i < KORPUS.serier.length; i++){
      if(KORPUS.serier[i][0] !== amneIdx) continue;
      const a = KORPUS.avkodad[i];
      let s = 0;
      for(let j = 0; j < N; j++){ const q = res.kurva[j] - a[j]; s += q * q; }
      const likhet = 1 - Math.sqrt(s / N);
      if(!bast || likhet > bast.likhet){ tvaa = bast; bast = {i, likhet}; }
      else if(!tvaa || likhet > tvaa.likhet) tvaa = {i, likhet};
    }
    if(!bast) return;

    const namnge = t => `${KORPUS.ind[KORPUS.serier[t.i][1]]} — ${KORPUS.land[KORPUS.serier[t.i][2]]}`;
    const r = KORPUS.serier[bast.i];
    $('d-amne').textContent = KORPUS.amnen[amneIdx][1];
    $('d-skal').textContent = beskriv(d);
    $('d-rader').innerHTML = [
      ['Din kurva är', namnge(bast)],
      ['Period', `${r[3]}–${r[4]}`],
      ['Spann', `${r[6]} – ${r[7]}`],
      ['Likhet', (bast.likhet * 100).toFixed(1) + ' %'],
      ['Tvåa', `${namnge(tvaa)}, ${(tvaa.likhet * 100).toFixed(1)} %`],
    ].map(([l, v]) => `<div class="row"><span class="lbl">${l}</span><span>${v}</span></div>`).join('');
    ritaJamforelse(res.kurva, KORPUS.avkodad[bast.i]);
    $('dom').classList.add('on'); domVisas = true;
    $('status').textContent = 'dom avkunnad';
  } finally { analyserar = false; }
}

function ritaJamforelse(min, deras){
  const k = $('d-kurva'), g = k.getContext('2d');
  const w = k.width, h = k.height, m = 16;
  g.clearRect(0, 0, w, h);
  const px = i => m + i / (N - 1) * (w - 2 * m);
  const py = v => h - m - v * (h - 2 * m);
  const linje = (a, stil, streck) => {
    g.beginPath();
    for(let i = 0; i < N; i++) i ? g.lineTo(px(i), py(a[i])) : g.moveTo(px(i), py(a[i]));
    g.strokeStyle = stil; g.lineWidth = 2.5; g.setLineDash(streck); g.stroke();
  };
  linje(deras, '#c0392b', []);
  linje(min, '#2b2f28', [6, 4]);
}
</script>
